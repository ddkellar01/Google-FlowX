name: Continuous Integration

on:
  push:
    branches: [ "main", "alpha-one" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Foundry (Solidity)
        uses: foundry-rs/foundry-toolchain@v1

      - name: Rust Core Lint & Build
        run: |
          cargo fmt
          cargo clippy -- -D warnings
          cargo build --release

      - name: Cognitive Engine Unit Tests
        run: |
          cd cognitive_engine
          pip install -r requirements.txt
          pytest tests/

      - name: EVM Smart Contract Tests
        run: |
          cd contracts
          forge test -vvv
